[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grip-pyrolyze-examples"
version = "0.1.0"
authors = [
    { name = "Gianni Mariani", email = "gianni@mariani.ws" },
]
description = "Example code and demos for grip-pyrolyze and PyRolyze."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: OS Independent",
]
dependencies = [
  "grip-py",
  "httpx>=0.27",
  "PySide6>=6.6",
]

[project.scripts]
grip-pyrolyze-demo = "grip_pyrolyze.examples.demo.main:main"

[tool.uv.sources]
grip-py = { path = "../grip-py", editable = true }

[project.urls]
Homepage = "https://github.com/owebeeone/grip-pyrolyze-examples"
"Bug Tracker" = "https://github.com/owebeeone/grip-pyrolyze-examples/issues"

[tool.hatch.envs.test]
dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grip_pyrolyze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
